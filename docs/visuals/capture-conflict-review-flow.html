<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture conflict review</title>
<style>
  :root {
    --bg:#faf9f7; --fg:#1c1917; --muted:#78716c; --box:#ffffff; --line:#d6d3d1;
    --accent:#ea580c; --new:#0284c7; --same:#a8a29e; --conf:#d97706; --bad:#dc2626; --ok:#059669;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --box:#292524; --line:#57534e;
            --accent:#fb923c; --new:#38bdf8; --same:#78716c; --conf:#fbbf24; --bad:#f87171; --ok:#34d399; }
  }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  svg { width:100%; max-width:960px; height:auto; display:block; }
  text { fill:var(--fg); font-size:15px; }
  .muted { fill:var(--muted); }
  .title { font-size:22px; font-weight:700; }
  .lane-label { font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; fill:var(--muted); }
  .box { fill:var(--box); stroke:var(--line); stroke-width:1.5; }
  .small { font-size:12.5px; }
  #bar { display:flex; gap:10px; align-items:center; margin-top:8px; font-size:14px; }
  #bar button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--box); color:var(--fg); cursor:pointer; }
  #bar button:hover { border-color:var(--accent); }
  #steps { color:var(--muted); min-width:90px; text-align:center; }
  body.fixed #bar { display:none; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 960 540" role="img" aria-label="How a pasted clip is handled today and with conflict review"></svg>
<div id="bar">
  <button id="back">Back</button><button id="pause">Pause</button><button id="next">Next</button>
  <span id="steps"></span>
</div>
<script>
// Five steps. One idea each. DURATIONS are seconds and match the narration in make_video.py.
const STEPS = [
  { dur: 7,  caption: "1. You paste a clip" },
  { dur: 11, caption: "2. Today: the comparison is hidden" },
  { dur: 11, caption: "3. With this change: compare first" },
  { dur: 12, caption: "4. You see page and clip side by side" },
  { dur: 12, caption: "5. You choose the action" },
];
const TOTAL = STEPS.reduce((a, s) => a + s.dur, 0);
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function el(tag, attrs = {}, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e);
  return e;
}
function node(x, y, w, h, label, o = {}) {
  el("rect", { x, y, width: w, height: h, rx: 10, class: "box", opacity: o.op ?? 1,
               style: o.stroke ? `stroke:var(--${o.stroke});stroke-width:2.5` : "" });
  el("text", { x: x + w / 2, y: y + h / 2 + 5, "text-anchor": "middle", opacity: o.op ?? 1 }, label);
}
function arrow(x1, y, x2, op = 1) {
  el("line", { x1, y1: y, x2, y2: y, stroke: "var(--line)", "stroke-width": 2, opacity: op });
  el("path", { d: `M${x2} ${y} l-8 -5 l0 10 z`, fill: "var(--line)", opacity: op });
}
// A dot that travels along x positions xs[0..n]; k in 0..1 is the whole trip.
function token(xs, y, k, color = "var(--accent)", op = 1) {
  const seg = clamp(k) * (xs.length - 1), i = Math.min(Math.floor(seg), xs.length - 2);
  const x = lerp(xs[i], xs[i + 1], ease(seg - i));
  el("circle", { cx: x, cy: y, r: 9, fill: color, opacity: op });
  el("circle", { cx: x, cy: y, r: 15, fill: "none", stroke: color, "stroke-width": 2, opacity: op * .35 });
}

function render(step, p) {
  svg.innerHTML = "";
  el("text", { x: 40, y: 44, class: "title" }, "Capture conflict review");
  el("text", { x: 40, y: 68, class: "muted small" }, STEPS[step].caption);

  const todayY = 150, newY = 355, h = 52, w = 120;
  const dimToday = step >= 3 ? 0 : step >= 2 ? .25 : 1, dimNew = step === 1 ? .25 : 1;

  // ── lane: today ──
  el("text", { x: 40, y: 112, class: "lane-label", opacity: dimToday }, "Today");
  const tx = [40, 200, 360, 520];
  ["Capture", "Extract", "Queue", "Approve"].forEach((l, i) =>
    node(tx[i], todayY, w, h, l, { op: dimToday, stroke: i === 3 && step === 1 && p > .8 ? "bad" : null }));
  [0, 1, 2].forEach(i => arrow(tx[i] + w, todayY + h / 2, tx[i + 1], dimToday));
  node(690, todayY, 230, h, "Writer may drop or blend", { op: dimToday * (step === 1 ? .4 + .6 * clamp((p - .6) * 3) : .5) });
  arrow(tx[3] + w, todayY + h / 2, 690, dimToday);
  el("text", { x: 690, y: todayY + h + 22, class: "muted small", opacity: dimToday * (step === 1 ? clamp((p - .7) * 4) : 0) },
    "You never saw what it compared.");

  // ── lane: with this change ──
  el("text", { x: 40, y: 317, class: "lane-label", opacity: dimNew }, "With this change");
  const nx = [40, 190, 340, 490, 640, 790];
  const nl = ["Capture", "Extract", "Compare", "Review", "You choose", "Write"];
  nl.forEach((l, i) => node(nx[i], newY, 110, h, l, { op: dimNew,
    stroke: (i === 2 && step === 2) || (i === 3 && step === 3) || (i === 4 && step === 4) ? "accent" : null }));
  for (let i = 0; i < 5; i++) arrow(nx[i] + 110, newY + h / 2, nx[i + 1], dimNew);

  // token(s)
  const midNew = newY - 16, midToday = todayY - 16;  // tokens ride just above the boxes
  if (step === 0) {
    const a = clamp(p * 3);
    el("circle", { cx: 40 + w / 2, cy: midToday, r: 9 * a, fill: "var(--accent)" });
    el("circle", { cx: 40 + 55, cy: midNew, r: 9 * a, fill: "var(--accent)" });
    el("text", { x: 40, y: 245, class: "small", opacity: a }, "Clip pasted. The app reads its claims.");
    // the pasted clip pulses, then three claims slide out of it one by one
    [midToday + 16, midNew + 16].forEach(y => {
      el("circle", { cx: 95, cy: y, r: 15 + 5 * Math.abs(Math.sin(p * 14)), fill: "none", stroke: "var(--accent)", "stroke-width": 2, opacity: .4 * a });
      [0, 1, 2].forEach(i => {
        const k = ease(clamp((p - .35 - i * .15) * 3));
        el("rect", { x: 130 + k * (30 + i * 70), y: y - 6 + (i - 1) * 9 * k, width: 54, height: 10, rx: 5, fill: "var(--muted)", opacity: k * .8 });
      });
    });
  } else if (step === 1) {
    token([100, 260, 420, 580], midToday, p);
  } else if (step === 2) {
    token([95, 245, 395], midNew, clamp(p * 1.4));
    if (p > .55) {   // claims fan out and get labels
      const labels = [["same", "var(--same)"], ["new", "var(--new)"], ["conflicts", "var(--conf)"]];
      labels.forEach(([t, c], i) => {
        const a = clamp((p - .55 - i * .1) * 5);
        const y = lerp(midNew, newY - 108 + i * 26, a);
        el("rect", { x: 340 + 60 - 48, y: y - 11, width: 96, height: 22, rx: 11, fill: c, opacity: a * .95 });
        el("text", { x: 400, y: y + 4, "text-anchor": "middle", style: "fill:#fff;font-size:12.5px;font-weight:600", opacity: a }, t);
      });
    }
  } else if (step === 3) {
    token([545, 545], midNew, 1, "var(--accent)", .0001);
    // side-by-side panel
    const a = ease(clamp(p * 2.5));
    const px = 130, py = 120, pw = 700, ph = 150;
    el("rect", { x: px, y: py, width: pw, height: ph, rx: 12, class: "box", opacity: a, style: "stroke:var(--accent);stroke-width:2" });
    el("text", { x: px + 20, y: py + 22, class: "muted small", opacity: a }, "ON THE PAGE");
    el("text", { x: px + 400, y: py + 22, class: "muted small", opacity: a }, "NEW CLIP");
    const rows = [
      ["BI tools cannot query it directly", "conflicts", "var(--conf)", "Power BI connects directly via ODBC"],
      ["—", "new", "var(--new)", "Parallel scan is about 4x faster"],
    ];
    rows.forEach(([l, v, c, r], i) => {
      const y = py + 62 + i * 46, show = clamp((p - .3 - i * .15) * 4);
      const pulse = i === 0 ? .55 + .45 * Math.abs(Math.sin(p * 9)) : 1;
      el("rect", { x: px + 14, y: y - 20, width: pw - 28, height: 32, rx: 8, fill: i === 0 ? "var(--conf)" : "none", opacity: show * (i === 0 ? .14 * pulse + .06 : 0) });
      el("text", { x: px + 20, y, class: "small", opacity: show }, l);
      el("rect", { x: px + 292, y: y - 15, width: 82, height: 22, rx: 11, fill: c, opacity: show });
      el("text", { x: px + 333, y: y, "text-anchor": "middle", style: "fill:#fff;font-size:12.5px;font-weight:600", opacity: show }, v);
      el("text", { x: px + 400, y, class: "small", opacity: show }, r);
    });
    const d = clamp((p - .7) * 4);
        el("text", { x: 130, y: 450, class: "small", opacity: d, style: "fill:var(--ok)" },
      "Exact duplicate: skipped, link to the page shown.");
  } else if (step === 4) {
    const labels = [["Add to page", "accent"], ["Keep both", null], ["Replace", null], ["Skip", "bad"]];
    labels.forEach(([t, s], i) => {
      const a = clamp((p - i * .12) * 4);
      node(150 + i * 170, 110, 150, 44, t, { op: a, stroke: s });
    });
    // replace: old page is copied to meta/replaced before it is overwritten
    const k = clamp((p - .35) * 1.8);
    node(150, 215, 150, 44, "old page", { op: clamp(p * 4) });
    node(560, 215, 230, 44, "meta/replaced/ (copy)", { op: clamp((p - .3) * 3), stroke: "ok" });
    arrow(300, 237, 560, clamp((p - .3) * 3));
    if (k > 0 && k < 1.01) el("circle", { cx: lerp(300, 560, ease(clamp(k))), cy: 237, r: 8, fill: "var(--ok)" });
    el("text", { x: 150, y: 450, class: "small", opacity: clamp((p - .6) * 4) }, "Replace copies the old page first. Nothing is lost.");
    el("text", { x: 150, y: 476, class: "muted small", opacity: clamp((p - .75) * 4) }, "Nothing is written until you pick an action.");
  }
}

// ── time → (step, p) ──
function at(t) {
  t = clamp(t, 0, TOTAL - 1e-6);
  let s = 0;
  while (t >= STEPS[s].dur) { t -= STEPS[s].dur; s++; }
  return [s, t / STEPS[s].dur];
}
const q = new URLSearchParams(location.search);
const fixed = q.has("step") || q.has("t");
if (fixed) {
  document.body.classList.add("fixed");
  const [s, p] = q.has("t") ? at(parseFloat(q.get("t"))) : [clamp(parseInt(q.get("step"), 10), 0, STEPS.length - 1), q.has("p") ? parseFloat(q.get("p")) : 1];
  render(s, clamp(p));
} else {
  let t = 0, last = performance.now(), paused = false;
  const label = document.getElementById("steps");
  const starts = STEPS.map((_, i) => STEPS.slice(0, i).reduce((a, s) => a + s.dur, 0));
  function frame(now) {
    if (!paused) t = (t + (now - last) / 1000) % TOTAL;
    last = now;
    const [s, p] = at(t);
    render(s, p);
    label.textContent = `Step ${s + 1} of ${STEPS.length}`;
    requestAnimationFrame(frame);
  }
  document.getElementById("pause").onclick = e => { paused = !paused; e.target.textContent = paused ? "Play" : "Pause"; };
  document.getElementById("next").onclick = () => { const [s] = at(t); t = starts[(s + 1) % STEPS.length]; };
  document.getElementById("back").onclick = () => { const [s, p] = at(t); t = starts[p > .15 ? s : (s + STEPS.length - 1) % STEPS.length]; };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
