<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge action flow</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1917; --line: #78716c;
    --old-fill: #f5f5f4; --old-stroke: #a8a29e;
    --new-fill: #dbeafe; --new-stroke: #2563eb;
    --bad-fill: #fee2e2; --bad-stroke: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --fg: #f5f5f4; --line: #a8a29e;
      --old-fill: #292524; --old-stroke: #78716c;
      --new-fill: #1e3a5f; --new-stroke: #60a5fa;
      --bad-fill: #4c1d1d; --bad-stroke: #f87171;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 8px; }
  svg { width: 100%; height: auto; display: block; }
  text { fill: var(--fg); font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
  .lbl { font-size: 11px; fill: var(--line); }
  .old { fill: var(--old-fill); stroke: var(--old-stroke); stroke-width: 1.5; }
  .new { fill: var(--new-fill); stroke: var(--new-stroke); stroke-width: 1.5; }
  .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 1.5; }
  .e { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .eb { stroke: var(--bad-stroke); stroke-width: 1.5; fill: none; marker-end: url(#ab); }
</style>
</head>
<body>
<main>
<h1>Merge action</h1>
<p>Read from the top. Grey exists today. Blue is new. Red is a failure path.</p>
<svg viewBox="0 0 740 940" role="img" aria-label="Flowchart of the merge action">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#78716c"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>

  <rect class="old" x="250" y="20" width="220" height="40" rx="8"/><text x="360" y="40">Open a clip with a target page</text>
  <path class="e" d="M360 60V90"/>
  <rect class="new" x="250" y="90" width="220" height="40" rx="8"/><text x="360" y="110">Click Merge into page</text>
  <path class="e" d="M360 130V160"/>
  <rect class="new" x="250" y="160" width="220" height="40" rx="8"/><text x="360" y="180">Model rewrites the page</text>
  <path class="e" d="M360 200V230"/>

  <path class="old" d="M360 230L470 270L360 310L250 270z"/><text x="360" y="270">Model call worked?</text>
  <path class="eb" d="M470 270H625V300"/><text class="lbl" x="500" y="260">no</text>
  <path class="e" d="M360 310V340"/><text class="lbl" x="376" y="326">yes</text>

  <path class="new" d="M360 340L470 380L360 420L250 380z"/><text x="360" y="380">Output checks passed?</text>
  <path class="eb" d="M470 380H625V350"/><text class="lbl" x="500" y="370">no</text>
  <rect class="bad" x="540" y="300" width="170" height="50" rx="8"/><text x="625" y="318">Show the reason.</text><text x="625" y="334">Clip stays in queue</text>
  <path class="e" d="M360 420V450"/><text class="lbl" x="376" y="436">yes</text>

  <rect class="new" x="250" y="450" width="220" height="40" rx="8"/><text x="360" y="470">Show old and merged text</text>
  <path class="e" d="M360 490V520"/>
  <path class="new" d="M360 520L470 560L360 600L250 560z"/><text x="360" y="560">User approves?</text>
  <path class="e" d="M250 560H170"/><text class="lbl" x="210" y="550">no</text>
  <rect class="old" x="20" y="540" width="150" height="40" rx="8"/><text x="95" y="560">Back to the buttons</text>
  <path class="e" d="M360 600V630"/><text class="lbl" x="376" y="616">yes</text>

  <rect class="new" x="250" y="630" width="220" height="40" rx="8"/><text x="360" y="650">Approve with merged text</text>
  <path class="e" d="M360 670V700"/>
  <path class="old" d="M360 700L470 740L360 780L250 740z"/><text x="360" y="740">Page hash matches?</text>
  <path class="eb" d="M470 740H540"/><text class="lbl" x="505" y="730">no</text>
  <rect class="bad" x="540" y="720" width="170" height="40" rx="8"/><text x="625" y="740">409: refresh the preview</text>
  <path class="e" d="M360 780V810"/><text class="lbl" x="376" y="796">yes</text>

  <rect class="new" x="250" y="810" width="220" height="40" rx="8"/><text x="360" y="830">Archive old page, write merge</text>
  <path class="e" d="M360 850V880"/>
  <rect class="old" x="250" y="880" width="220" height="40" rx="8"/><text x="360" y="900">Clip leaves the queue</text>
</svg>
<p><span style="color:var(--old-stroke)">■</span> exists today &nbsp; <span style="color:var(--new-stroke)">■</span> new or changed &nbsp; <span style="color:var(--bad-stroke)">■</span> failure path</p>
<p>Nothing is written until the user approves the preview. The old page is archived first.</p>
</main>
</body>
</html>
