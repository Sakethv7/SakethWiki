<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk resolve walkthrough flow</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1917; --line: #78716c;
    --old-fill: #f5f5f4; --old-stroke: #a8a29e;
    --new-fill: #dbeafe; --new-stroke: #2563eb;
    --bad-fill: #fee2e2; --bad-stroke: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --fg: #f5f5f4; --line: #a8a29e;
      --old-fill: #292524; --old-stroke: #78716c;
      --new-fill: #1e3a5f; --new-stroke: #60a5fa;
      --bad-fill: #4c1d1d; --bad-stroke: #f87171;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 8px; }
  svg { width: 100%; height: auto; display: block; }
  text { fill: var(--fg); font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
  .lbl { font-size: 11px; fill: var(--line); }
  .old { fill: var(--old-fill); stroke: var(--old-stroke); stroke-width: 1.5; }
  .new { fill: var(--new-fill); stroke: var(--new-stroke); stroke-width: 1.5; }
  .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); stroke-width: 1.5; }
  .e { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .eb { stroke: var(--bad-stroke); stroke-width: 1.5; fill: none; marker-end: url(#ab); }
</style>
</head>
<body>
<main>
<h1>Bulk resolve walkthrough</h1>
<p>Read from the top. Grey exists today. Blue is new. Red is a failure path.</p>
<svg viewBox="0 0 740 950" role="img" aria-label="Flowchart of the bulk resolve walkthrough">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#78716c"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>

  <!-- 1 -->
  <rect class="old" x="250" y="20" width="220" height="40" rx="8"/><text x="360" y="40">Queue lists clips with reports</text>
  <path class="e" d="M360 60V90"/>
  <!-- 2 -->
  <rect class="old" x="250" y="90" width="220" height="40" rx="8"/><text x="360" y="110">User ticks clips</text>
  <path class="e" d="M360 130V160"/>
  <!-- 3 diamond -->
  <path class="new" d="M360 160L470 205L360 250L250 205z"/><text x="360" y="205">Any clip needs review?</text>
  <path class="e" d="M470 205H540"/><text class="lbl" x="505" y="195">no</text>
  <!-- 4 -->
  <rect class="old" x="540" y="185" width="170" height="40" rx="8"/><text x="625" y="205">Approve selected, as today</text>
  <path class="e" d="M360 250V280"/><text class="lbl" x="376" y="266">yes</text>
  <!-- 5 -->
  <rect class="new" x="250" y="280" width="220" height="40" rx="8"/><text x="360" y="300">Resolve selected button</text>
  <path class="e" d="M360 320V350"/>
  <!-- 6 -->
  <rect class="new" x="250" y="350" width="220" height="50" rx="8"/><text x="360" y="368">Show clip n of N:</text><text x="360" y="386">what is new, changed, conflicting</text>
  <path class="e" d="M360 400V430"/>
  <!-- 7 diamond -->
  <path class="new" d="M360 430L470 475L360 520L250 475z"/><text x="360" y="475">Which action?</text>
  <path class="e" d="M250 475H170"/><text class="lbl" x="210" y="465">later</text>
  <!-- 8 -->
  <rect class="new" x="40" y="455" width="130" height="40" rx="8"/><text x="105" y="475">Decide later</text>
  <path class="e" d="M360 520V550"/><text class="lbl" x="400" y="535">add / keep / replace / skip</text>
  <!-- 9 -->
  <rect class="old" x="250" y="550" width="220" height="40" rx="8"/><text x="360" y="570">POST approve with choice</text>
  <path class="e" d="M360 590V620"/>
  <!-- 10 diamond -->
  <path class="old" d="M360 620L470 665L360 710L250 665z"/><text x="360" y="665">Write worked?</text>
  <path class="e" d="M360 710V740"/><text class="lbl" x="376" y="726">yes</text>
  <!-- stale -->
  <path class="eb" d="M470 665H540"/><text class="lbl" x="505" y="655">stale</text>
  <rect class="new" x="540" y="645" width="170" height="40" rx="8"/><text x="625" y="665">Refresh comparison</text>
  <path class="e" d="M625 645V375H470"/>
  <!-- failed -->
  <path class="eb" d="M250 665H170"/><text class="lbl" x="210" y="655">error</text>
  <rect class="bad" x="40" y="645" width="130" height="40" rx="8"/><text x="105" y="665">Mark failed, show why</text>
  <!-- record -->
  <rect class="new" x="250" y="740" width="220" height="40" rx="8"/><text x="360" y="760">Record result for clip</text>
  <path class="e" d="M20 475V760H250"/>
  <path class="eb" d="M105 685V760"/>
  <path class="e" d="M360 780V810"/>
  <!-- more clips -->
  <path class="old" d="M360 810L460 845L360 880L260 845z"/><text x="360" y="845">More clips?</text>
  <path class="e" d="M460 845H700V375H625"/><text class="lbl" x="580" y="835">yes</text>
  <path class="e" d="M360 880V905"/><text class="lbl" x="376" y="893">no</text>
  <rect class="new" x="250" y="905" width="220" height="36" rx="8"/><text x="360" y="923">Summary: done, left, failed</text>
</svg>
<p><span style="color:var(--old-stroke)">■</span> exists today &nbsp; <span style="color:var(--new-stroke)">■</span> new or changed &nbsp; <span style="color:var(--bad-stroke)">■</span> failure path</p>
<p>Replace page is the only action that removes old claims. Add to page keeps them and flags conflicts.</p>
</main>
</body>
</html>
